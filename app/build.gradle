// Android application module：只放适配层（WebView / TTS / 相机 / 语音 / HTTPS）。
// 逻辑全在 :core 里，方便单测；这里的第三方依赖只有 Compose（日志页）和 ML Kit（检测器）。
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 真 HTTPS 的端点 / 模型 / key 从 local.properties 读（那份文件不进版本库，和 sdk.dir 一起）。
// 注意 key 会**明文编进 BuildConfig**：自用没问题，构建产物别给别人。
def duckProps = new Properties()
def duckPropsFile = rootProject.file('local.properties')
if (duckPropsFile.exists()) {
    duckPropsFile.withInputStream { duckProps.load(it) }
}
def duckProp = { String name, String fallback ->
    duckProps.getProperty(name, fallback).replace('\\', '\\\\').replace('"', '\\"')
}

// 签名：在 local.properties 里配 duck.storeFile / duck.storePassword / duck.keyAlias /
// duck.keyPassword 就会用它签 release；没配就出一个未签名的包（装不上别人的手机，
// 自己本地调试够用）。**不要把 keystore 和密码提交进仓库。**
//   keytool -genkeypair -v -keystore duck-release.jks -keyalg RSA -keysize 2048 \
//           -validity 10000 -alias duck
def storePath = duckProps.getProperty('duck.storeFile', '')

android {
    namespace 'com.fanduck.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fanduck.agent'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        // ML Kit 的 libmlkitcommonpipeline.so 按 4 个 ABI 各打一份（合计 40 MB）。
        // 只留 arm64-v8a：这台真机和这台模拟器都是 arm64，x86/x86_64/armeabi-v7a
        // 三份纯属白扛 —— debug APK 从 67 MB 回到 37 MB。
        ndk {
            abiFilters 'arm64-v8a'
        }

        buildConfigField 'String', 'DUCK_ENDPOINT',
                "\"${duckProp('duck.endpoint', 'https://api.deepseek.com/chat/completions')}\""
        buildConfigField 'String', 'DUCK_MODEL', "\"${duckProp('duck.model', 'deepseek-chat')}\""
        buildConfigField 'String', 'DUCK_API_KEY', "\"${duckProp('duck.apiKey', '')}\""
    }

    signingConfigs {
        release {
            if (storePath) {
                storeFile file(storePath)
                storePassword duckProps.getProperty('duck.storePassword', '')
                keyAlias duckProps.getProperty('duck.keyAlias', '')
                keyPassword duckProps.getProperty('duck.keyPassword', '')
            }
        }
    }

    buildTypes {
        release {
            // 日志页那套 Compose + ML Kit 没混淆时 dex 就有 14 MB。各家的 AAR 自带
            // consumer rules，这里只需要 proguard-rules.pro 兜底。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (storePath) {
                signingConfig signingConfigs.release
            }
            // **release 不编 duck.apiKey**。那份 key 是自己的，编进包里就等于谁拿到 APK
            // 谁拿到 key（DeepSeek 是预付费，被刷是自己的钱）。要给自己出一个能连云端的
            // release 包，就在 local.properties 里单独填 duck.releaseApiKey。
            // 不填的话 release 会退回演示假大脑（ScriptedCloud），没网也能跑。
            buildConfigField 'String', 'DUCK_API_KEY', "\"${duckProp('duck.releaseApiKey', '')}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true   // 调试用的 url 入口只在 debug 构建生效
        compose true       // 只有日志页（LogActivity）用 Compose
    }

    composeOptions {
        // 和 Kotlin 1.9.20 配对的编译器版本，本机 Gradle 缓存里已有
        kotlinCompilerExtensionVersion '1.5.4'
    }

    sourceSets {
        main {
            kotlin.srcDirs += 'src/main/kotlin'
            assets.srcDirs += 'src/main/assets'
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation project(':core')

    // 只有日志页（LogActivity）用 Compose。
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'

    // 检测器（CameraSense）。**bundled 版**：模型 2.9 MB 跟着 APK 走，不下载、不联网。
    // 另一个选择是 com.google.android.gms:play-services-mlkit-image-labeling:16.0.8
    // （模型走 Play 服务现下，APK 只涨两三兆）—— **不要用**：实测带 Play 服务的模拟器
    // 都下不动那个 optional module（`DynamiteModule: Local module descriptor class for
    // com.google.android.gms.vision.ica not found`），国内真机更没戏。见 doc/gotchas.md。
    implementation 'com.google.mlkit:image-labeling:17.0.9'
}
